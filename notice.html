<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>域名已更换</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    padding: 48px 40px;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 24px;
    font-weight: 600;
  }
  p {
    font-size: 16px;
    color: #555;
    line-height: 1.8;
  }
  .highlight {
    color: #e74c3c;
    font-weight: 600;
  }
  .new-domain {
    display: inline-block;
    background: #d4edda;
    border: 2px solid #28a745;
    border-radius: 8px;
    padding: 10px 20px;
    margin: 20px 0;
    font-size: 22px;
    font-weight: 700;
    color: #155724;
    letter-spacing: 1px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .new-domain:hover {
    background: #c3e6cb;
    transform: scale(1.03);
  }
  .footer {
    margin-top: 28px;
    font-size: 13px;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📢</div>
  <h1>域名已更换</h1>
  <p>因续费域名昂贵，本网站已于<span class="highlight">5月24日</span>更换域名为</p>
  <a href="https://tkfm.cLub" class="new-domain">tkfm.cLub</a>
  <p>之后这个域名会被别人抢注，<br>请及时更换收藏夹中的网址。</p>
  <div class="footer">点击上方域名即可跳转到新网站</div>
</body>
</html>
